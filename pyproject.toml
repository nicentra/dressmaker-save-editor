[project]
name = "dressmaker-save-editor"
version = "0.0.0"
description = "Save editor for the game Dressmaker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "PySide6-Essentials>=6.8",
    "UnityPy>=1.25",
    "TypeTreeGeneratorAPI>=0.0.5",
    "dnfile>=0.15",
    "psutil>=6.0",
]

[project.gui-scripts]
dressmaker-save-editor = "dressmaker_editor.__main__:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "ruff>=0.8",
]
build = [
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dressmaker_editor"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "game: needs a local Dressmaker install and saves (skipped when missing)",
]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
