# Install once per clone: uv run pre-commit install
# Run everything by hand: uv run pre-commit run --all-files
#
# Save fixtures and the bundled game data are byte-exact copies of what the
# game writes (tab-only lines, no final newline), so whitespace fixers skip them.
exclude: ^(tests/fixtures/|src/dressmaker_editor/data/.*\.json$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.9
    hooks:
      - id: uv-lock
