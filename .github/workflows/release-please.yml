# Added by `git wt setup --releases`. Every push to main updates one open
# release PR (version bump + CHANGELOG.md). Merging that PR tags the release and
# publishes a GitHub Release. Config: release-please-config.json and
# .release-please-manifest.json.
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # Tags and releases made with GITHUB_TOKEN do not trigger other workflows, so
  # the executable is built and attached here, after release-please made the
  # release.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      release: true

  upload:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DressmakerSaveEditor-windows
      - name: Attach the executable to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" DressmakerSaveEditor.exe --repo "$GITHUB_REPOSITORY" --clobber
