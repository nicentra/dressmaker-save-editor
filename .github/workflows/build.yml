# Builds DressmakerSaveEditor.exe and checks that the packaged program works.
# Used by CI on every pull request and by the release workflow.
name: Build

on:
  workflow_call:
    inputs:
      release:
        description: Build a release (plain version) instead of a development build (+dev.<commit>)
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # --frozen: the release PR bumps the project version in uv.lock, and the
      # release build must not fail if that bump ever lags behind pyproject.toml.
      - run: uv sync --frozen --group build
      - run: uv run python scripts/build_exe.py
        env:
          DRESSMAKER_RELEASE: ${{ inputs.release }}
      - name: Self-test the executable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'self-test.txt'
          $proc = Start-Process dist/DressmakerSaveEditor.exe -ArgumentList '--self-test', $report -Wait -PassThru
          Get-Content $report
          if ($proc.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DressmakerSaveEditor-windows
          path: dist/DressmakerSaveEditor.exe
          if-no-files-found: error
