# Builds DressmakerSaveEditor.exe and checks that the packaged program works.
# Used by CI on every pull request and by the release workflow.
name: Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked --group build
      - run: uv run python scripts/build_exe.py
      - name: Self-test the executable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'self-test.txt'
          $proc = Start-Process dist/DressmakerSaveEditor.exe -ArgumentList '--self-test', $report -Wait -PassThru
          Get-Content $report
          if ($proc.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DressmakerSaveEditor-windows
          path: dist/DressmakerSaveEditor.exe
          if-no-files-found: error
